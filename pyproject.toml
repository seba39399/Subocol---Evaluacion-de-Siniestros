[project]
name = "subocol-prueba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.88",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Directorios objetivos
src = ["src", "tests"]
# Versión de Python objetivo
target-version = "py312"
# Longitud máxima de línea (estándar moderno)
line-length = 88

[tool.ruff.lint]
# Reglas seleccionadas:
# E/W = Pycodestyle (errores y advertencias estándar)
# F   = Pyflakes (variables no usadas, imports corruptos)
# I   = isort (ordenamiento profesional de imports)
# B   = flake8-bugbear (patrones propensos a bugs)
# UP  = pyupgrade (sintaxis moderna de Python 3.12)
# C90 = mccabe (complejidad ciclomática)
select = ["E", "W", "F", "I", "B", "UP", "C90"]

# Ignorar reglas específicas que colisionen con el formateador de Ruff
ignore = ["E501"]

# Permitir autofix automático para estas reglas
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
# Alerta si una función es demasiado compleja (más de 10 caminos lógicos)
max-complexity = 10

[tool.ruff.format]
# Formateador idéntico a Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
