services:
  backend:
    image: seba39399/subocol-backend:latest
    container_name: subocol-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: seba39399/subocol-frontend:latest
    container_name: subocol-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
